# =============================================================================
# CI/CD pipeline — push to main -> build -> Artifact Registry -> Cloud Run
#
# Run manually:
#   gcloud builds submit --config cloudbuild.yaml
#
# Wire it to pushes on a branch:
#   gcloud builds triggers create github \
#     --repo-name=angular-ssr-gcloud-run --repo-owner=<your-user> \
#     --branch-pattern='^main$' --build-config=cloudbuild.yaml
# =============================================================================

substitutions:
  _SERVICE: angular-ssr
  _REGION: southamerica-east1
  _REPO: containers

steps:
  # ---------------------------------------------------------------------------
  # 1. Build the image, reusing the previous one as a layer cache.
  #
  # The `|| true` on the pull is deliberate: on the very first build the
  # :latest tag does not exist yet and the pull fails. Without it, the pipeline
  # would break on its first run.
  # ---------------------------------------------------------------------------
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"
        docker pull "$$IMAGE:latest" || true
        docker build \
          --cache-from "$$IMAGE:latest" \
          -t "$$IMAGE:$SHORT_SHA" \
          -t "$$IMAGE:latest" \
          .

  # ---------------------------------------------------------------------------
  # 2. Push both tags: :SHORT_SHA gives traceability (every image maps to a
  #    commit) and :latest serves as the cache source for the next build.
  # ---------------------------------------------------------------------------
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"
        docker push "$$IMAGE:$SHORT_SHA"
        docker push "$$IMAGE:latest"

  # ---------------------------------------------------------------------------
  # 3. Deploy. Every deploy creates an immutable revision, which is what makes
  #    90/10 traffic splitting and one-click rollback possible without
  #    rebuilding anything.
  # ---------------------------------------------------------------------------
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --cpu=1
      - --memory=512Mi
      # High concurrency = fewer instances = lower cost. Rendering HTML is
      # cheap, and CPU is rarely the bottleneck for a typical page.
      - --concurrency=80
      # One always-warm instance keeps cold starts off the user's critical path.
      - --min-instances=1
      - --max-instances=20
      # Extra CPU during startup only, without paying for it continuously.
      - --cpu-boost

# Images recorded in the build result, for traceability.
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
