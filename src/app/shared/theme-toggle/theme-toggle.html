<button type="button" class="toggle" (click)="toggle()" aria-label="Toggle light or dark theme">
  <!-- Sun: shown while the dark theme is active, as the action it offers. -->
  <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="4.2" />
    <g stroke-linecap="round">
      <line x1="12" y1="2.5" x2="12" y2="5" />
      <line x1="12" y1="19" x2="12" y2="21.5" />
      <line x1="2.5" y1="12" x2="5" y2="12" />
      <line x1="19" y1="12" x2="21.5" y2="12" />
      <line x1="5.3" y1="5.3" x2="7.1" y2="7.1" />
      <line x1="16.9" y1="16.9" x2="18.7" y2="18.7" />
      <line x1="5.3" y1="18.7" x2="7.1" y2="16.9" />
      <line x1="16.9" y1="7.1" x2="18.7" y2="5.3" />
    </g>
  </svg>

  <!-- Moon: shown while the light theme is active. -->
  <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
  </svg>
</button>
