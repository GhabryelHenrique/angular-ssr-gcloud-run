<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Angular SSR on Cloud Run</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reference project for deploying an Angular SSR application to Google Cloud Run.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    /*
     * Restores a previously chosen theme before first paint.
     *
     * This has to run here, synchronously in <head>, rather than inside
     * Angular: the server cannot know the visitor's choice, so any theme
     * decision made after bootstrap arrives too late and the page visibly
     * flashes the wrong colours on every load.
     *
     * Light is the default and the system preference is intentionally not
     * consulted; dark is opt-in through the header toggle. Doing nothing here
     * therefore leaves the page light, which is the desired fallback when
     * storage is unavailable.
     *
     * It only sets an attribute. Nothing in the server-rendered markup depends
     * on the theme, so hydration is unaffected.
     */
    (function () {
      try {
        if (localStorage.getItem('preferred-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        /* Private browsing or storage disabled: stay on the light default. */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
