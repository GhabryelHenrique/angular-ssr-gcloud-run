<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Angular SSR on Cloud Run</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reference project for deploying an Angular SSR application to Google Cloud Run.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    /*
     * Applies the stored theme before first paint.
     *
     * This has to run here, synchronously in <head>, rather than inside
     * Angular: the server cannot know the visitor's preference, so any theme
     * decision made after bootstrap arrives too late and the page visibly
     * flashes the wrong colours on every load.
     *
     * It only sets an attribute. Nothing in the server-rendered markup depends
     * on the theme, so hydration is unaffected.
     */
    (function () {
      try {
        var stored = localStorage.getItem('preferred-theme');
        if (stored !== 'light' && stored !== 'dark') {
          stored = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', stored);
      } catch (e) {
        /* Private browsing or storage disabled: fall back to the CSS media query. */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
