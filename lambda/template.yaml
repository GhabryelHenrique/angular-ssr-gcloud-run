AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Angular SSR on AWS Lambda — the equivalent of a one-line "gcloud run deploy".
  Compare the size of this file with that single command.

Parameters:
  FunctionName:
    Type: String
    Default: angular-ssr

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024

Resources:
  SsrFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      PackageType: Image
      Architectures:
        - arm64
      Environment:
        Variables:
          NODE_ENV: production
          # The same SSRF protection as Cloud Run: without the correct host
          # here, every request comes back 400.
          ALLOWED_HOSTS: !Sub '*.lambda-url.${AWS::Region}.on.aws'

      FunctionUrlConfig:
        AuthType: NONE
        # HTML streaming only exists through a Function URL. Behind API
        # Gateway the response is always buffered and capped at 6 MB.
        InvokeMode: RESPONSE_STREAM

      # Provisioned concurrency can only target a published alias, hence
      # AutoPublishAlias. Without it, the deploy fails validation.
      AutoPublishAlias: live

      # Cold start mitigation, equivalent to Cloud Run's --min-instances.
      # Important difference: this is provisioned per concurrent execution.
      # Lambda serves ONE request per execution environment, so 80 parallel
      # requests need 80 environments — where a single Cloud Run instance with
      # --concurrency 80 would do.
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 1

    Metadata:
      Dockerfile: lambda/Dockerfile
      DockerContext: ..
      DockerTag: latest

Outputs:
  FunctionUrl:
    Description: Public URL of the function
    Value: !GetAtt SsrFunctionUrl.FunctionUrl

  WhatThisNeeded:
    Description: What this template required and Cloud Run did not
    Value: >
      A separate entry point, an extra build configuration, an event adapter,
      this template, and a Function URL with an explicit invoke mode.
